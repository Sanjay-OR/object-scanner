<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Live camera preview (visible so sighted testers can confirm the feed) -->
    <div class="stage">
      <video id="camera-feed" autoplay muted playsinline></video>
      <canvas id="detection-canvas"></canvas>
      <div id="no-signal" class="no-signal">No camera signal</div>
    </div>

    <!-- Main control area -->
    <div class="container">
      <div class="status-bar" aria-live="polite" aria-atomic="true" id="status-message">
        Ready to scan. Tap anywhere to start.
      </div>

      <div class="camera-panel" id="camera-panel">
        <div class="camera-row">
          <span class="camera-dot" id="camera-dot" aria-hidden="true"></span>
          <span id="camera-label">Detecting cameras&hellip;</span>
        </div>
        <div class="camera-meta" id="camera-meta"></div>
        <button id="switch-camera" class="switch-camera" hidden>Switch camera</button>
      </div>

      <div class="controls">
        <button id="toggle-button" class="toggle-button" aria-label="Start scanning">
          <span class="button-text">TAP TO START</span>
        </button>

        <div class="info-section">
          <h1>Object Scanner</h1>
          <p>Point your camera at objects to identify them, their distance, and direction.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MediaPipe Tasks Vision (loaded via app.js) -->
  <script type="module" src="app.js"></script>
</body>
</html>
