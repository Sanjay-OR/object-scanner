<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Camera preview sits behind everything, dimmed. It exists for sighted
       testers; nothing in the interface depends on being able to see it. -->
  <div class="stage" aria-hidden="true">
    <video id="camera-feed" autoplay muted playsinline></video>
    <canvas id="detection-canvas"></canvas>
  </div>

  <!-- The entire screen is the one and only control. -->
  <button id="toggle-button" class="tap-area" aria-describedby="status-message">
    <span class="action" id="action-text">Tap to start</span>
    <span class="hint" id="hint-text">Anywhere on the screen</span>
  </button>

  <!-- Spoken aloud as well, so this is a mirror of the audio, not extra info. -->
  <p id="status-message" class="status" role="status" aria-live="polite">
    Starting up
  </p>

  <button id="switch-camera" class="switch-camera" hidden>Switch camera</button>

  <!-- Diagnostics for sighted testing only; hidden from screen readers so it
       never lands between the user and the button. -->
  <p id="camera-info" class="camera-info" aria-hidden="true"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
